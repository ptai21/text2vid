[project]
name = "text2vid"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.8"
dependencies = [
    "edge-tts>=7.2.8",
    "fastapi>=0.141.1",
    "google-genai>=2.19.0",
    "jinja2>=3.1.6",
    "matplotlib>=3.11.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["slow: touches real network or ffmpeg"]
addopts = "-m 'not slow'"